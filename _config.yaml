# site properties and page defaults
title: seevi-lab
subtitle: Computer vision for provenance, integrity, and perception
description: The SeeVi Lab at Colorado State University, led by Dr. Aparna Bharati, develops computer vision methods to analyze, verify, and interpret visual information.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: aparna.bharati@colostate.edu
  orcid: 0000-0001-8713-9213
  google-scholar: ETJoidYAAAAJ
  github: aparnabharati
  twitter: aparnabharati

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: false

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - projects
  - blog
