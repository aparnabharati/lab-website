{% assign items = include.data | sort: "date" | reverse %}
{% if include.limit %}
  {% assign items = items | slice: 0, include.limit %}
{% endif %}

<div class="timeline">
  {% for item in items %}
    <div class="timeline-row">
      <span class="timeline-date">{{ item.date | date: "%B %d, %Y" }}</span>
      <span class="timeline-dot"></span>
      {% if item.link %}
        <a class="timeline-title" href="{{ item.link | relative_url | uri_escape }}">
          {{ item.title }}
        </a>
      {% else %}
        <p class="timeline-title">{{ item.title }}</p>
      {% endif %}
    </div>
  {% endfor %}
</div>
