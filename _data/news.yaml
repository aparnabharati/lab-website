# Recent lab news, shown newest first.
# Fields: date (required), title (required), description (optional), link (optional).

- date: '2026-08-01'
  title: "The lab moves to Colorado State University"
  description: >
    SeeVi relocates from Lehigh to the Department of Computer Science at
    Colorado State University in Fort Collins, where the lab continues its work
    on provenance, media integrity, and visual perception.

- date: '2026-06-03'
  title: "StyleProtect presented at CVPR 2026"
  description: >
    Qiuyu Tang presented StyleProtect in Denver. The method perturbs only the
    cross-attention layers that carry style rather than the whole model, letting
    artists resist style mimicry from finetuned diffusion models at lower cost.
  link: https://cv-lehigh.github.io/StyleProtect/

- date: '2026-03-06'
  title: "Work on human-like biases in vision-language models accepted to WACV 2026"
  description: >
    Chaitanya Roygaga's paper asks whether vision-language models reproduce the
    snap judgements people make about faces, probing them with generated captions
    instead of fixed templates.
  link: https://doi.org/10.1109/WACV61042.2026.00058

- date: '2026-02-28'
  title: "The lab helps organize the VALED workshop at WACV 2026"
  description: >
    VALED — Visual Art, Generative AI, and the Legal/Ethical Dilemma — brings
    together researchers, artists, legal scholars, and industry practitioners to
    examine style mimicry, dataset auditing, provenance, and the copyright
    questions raised by text-to-image generation.
  link: https://aparnabharati.github.io/valed-workshop-2026/

- date: '2025-09-14'
  title: "Paper on perturbation-based image protection accepted to ICIP 2025"
  description: >
    Led by Qiuyu Tang, the paper tests PhotoGuard, Mist and Glaze and finds they
    do not disrupt editing as intended. Adding protective noise often makes the
    resulting edit align more closely with the attacker's prompt, not less.
  link: https://doi.org/g92w3b

- date: '2025-06-17'
  title: "Paper on neural compression of scientific images accepted to ACM IH&MMSec"
  description: >
    With collaborators at Unicamp and Loyola University Chicago. Neural codecs
    such as JPEG-AI preserve both the meaning of scientific images and the
    forensic traces of tampering better than standard JPEG at similar bitrates.
  link: https://doi.org/g92wpf

- date: '2025-02-26'
  title: "Paper on foundation models with negations accepted to WACV 2025"
  description: >
    Part of a line of work on why vision-language models handle affirmation well
    and negation poorly.
  link: https://doi.org/g92w29
